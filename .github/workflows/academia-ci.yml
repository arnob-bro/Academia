name: Linter and Auto-Fixer

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  php-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress
        working-directory: backend_directory_name  # Change to actual backend folder

      - name: Run PHP Linter
        run: ~/.composer/vendor/bin/phpcs --standard=PSR12 app/ routes/
        working-directory: backend_directory_name  # Change to actual backend folder

      - name: Auto-fix PHP Code
        run: ~/.composer/vendor/bin/phpcbf --standard=PSR12 app/ routes/
        working-directory: backend_directory_name  # Change to actual backend folder

  js-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --prefix Academia_Frontend

      - name: Run ESLint
        run: npm run lint --prefix Academia_Frontend

      - name: Run JavaScript tests
        run: npm test --prefix Academia_Frontend || echo "No tests found, skipping."
