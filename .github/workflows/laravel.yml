name: Laravel Docker CI/CD

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: academia_db
          MYSQL_USER: academia_user
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.0'

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Set Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Migrations
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: academia_db
        DB_USERNAME: academia_user
        DB_PASSWORD: secret
      run: php artisan migrate --force

    - name: Execute Tests (Unit and Feature)
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: academia_db
        DB_USERNAME: academia_user
        DB_PASSWORD: secret
      run: php artisan test

  build-and-push:

    runs-on: ubuntu-latest
    needs: laravel-tests # Runs only if tests pass

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Laravel Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/academia_backend:latest -f backend/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/academia_backend:latest
