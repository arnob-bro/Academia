name: Node.js Docker CI/CD

on:
  push:
    branches: [ developer ] # Replace $default-branch with actual branch (e.g., 'main')
  pull_request:
    branches: [ developer ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests
      run: npm test

    - name: Build Frontend
      run: npm run build --if-present

  build-and-push:

    runs-on: ubuntu-latest
    needs: build  

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image for Frontend
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/academia_frontend:latest -f frontend/Dockerfile .
        docker push ${{ secrets.DOCKER_USERNAME }}/academia_frontend:latest
